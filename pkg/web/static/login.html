<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆库 · 登录</title>
<!--
  样式内联在页面里：登录页是**公开**路由，而 /memory/static/* 需要口令
  （design.md §11.4），外链样式表会被 401 拦掉，导致登录页裸奔。
  与下方脚本内联同一理由。
-->
<style>
  :root {
    --fg: #1f2328;
    --fg-dim: #656d76;
    --bg: #ffffff;
    --bg-soft: #f6f8fa;
    --border: #d0d7de;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg-soft);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    width: min(360px, 92vw);
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; }
  .login-card .hint { color: var(--fg-dim); margin: 0; }
  .login-card form { display: flex; gap: 8px; margin-top: 14px; }
  .login-card input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
  }
  .login-card button {
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .login-card button[disabled] { opacity: 0.6; cursor: default; }
  .error { color: #cf222e; min-height: 1.2em; margin: 10px 0 0; }
</style>
</head>
<body class="login-body">
<main class="login-card">
  <h1>记忆库</h1>
  <p class="hint">输入访问口令（长期有效，只需输一次）</p>
  <form id="login-form">
    <input id="token" type="password" autocomplete="current-password" placeholder="访问口令" required autofocus>
    <button type="submit" id="submit">进入</button>
  </form>
  <p id="msg" class="error" role="alert"></p>
</main>
<script>
'use strict';
// 登录脚本内联在页面里：理由同上（静态资源需认证，公开页不能外链）。
document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById('msg');
  const button = document.getElementById('submit');
  msg.textContent = '';
  button.disabled = true;
  try {
    const res = await fetch('/memory/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value }),
    });
    if (res.ok) {
      window.location.replace('/memory/');
      return;
    }
    if (res.status === 429) {
      msg.textContent = '尝试次数过多，请稍后再试。';
    } else if (res.status === 401) {
      msg.textContent = '口令不正确。';
    } else {
      msg.textContent = '登录失败（HTTP ' + res.status + '）。';
    }
  } catch (err) {
    msg.textContent = '网络错误：' + err.message;
  } finally {
    button.disabled = false;
    document.getElementById('token').select();
  }
});
</script>
</body>
</html>
